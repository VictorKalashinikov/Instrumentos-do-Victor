
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha | Instrumentos do Victor</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <script src="supabase-config.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <main class="form-section">
        <div class="form-wrapper">

            <div class="mobile-logo">
                <a href="index.html" class="logo">
                    <span class="logo-icon">♪</span>
                    <span>INSTRUMENTOS <strong>DO VICTOR</strong></span>
                </a>
            </div>

            <span class="eyebrow">RECUPERAÇÃO DE CONTA</span>

            <h2>Crie uma nova senha</h2>

            <p class="form-description">
                Informe sua nova senha para recuperar o acesso.
            </p>

            <form id="resetForm" novalidate>

                <div class="field">
                    <label for="novaSenha">Nova senha</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="novaSenha"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Mínimo de 8 caracteres"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="novaSenha"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmarNovaSenha">
                        Confirmar nova senha
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmarNovaSenha"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Digite novamente"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmarNovaSenha"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <p
                    id="resetMessage"
                    class="message"
                    role="status"
                ></p>

                <button type="submit" class="primary-button">
                    Salvar nova senha
                </button>

            </form>

            <p class="switch-form" style="margin-top: 24px">
                <a href="index.html">Voltar para o login</a>
            </p>

        </div>
    </main>
</body>
</html>
